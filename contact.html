<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - ElectroStore</title>
<meta name="description" content="Arduino, ESP32, Raspberry Pi, sensors and electronic components for university students in Egypt.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<div class="page-header"><div class="container"><h1>Contact Us</h1><p class="breadcrumb"><a href="index.html">Home</a> / Contact</p></div></div>
<section class="section"><div class="container contact-layout">
  <div class="contact-card-list">
    <a id="wa-link" target="_blank" rel="noopener" class="contact-item whatsapp"><span class="icon-circle">W</span><div><h4>Chat on WhatsApp</h4><span id="wa-text"></span></div></a>
    <a id="fb-link" target="_blank" rel="noopener" class="contact-item facebook"><span class="icon-circle">f</span><div><h4>Follow us on Facebook</h4><span>Facebook page</span></div></a>
    <a id="mail-link" class="contact-item email"><span class="icon-circle">@</span><div><h4>Email Support</h4><span id="mail-text"></span></div></a>
  </div>
  <div class="form-card"><h3 style="margin-bottom:20px">Send us a message</h3>
  <form id="contact-form">
    <div class="form-group"><label>Your Name</label><input name="name" required></div>
    <div class="form-group"><label>Email Address</label><input name="email" type="email" required></div>
    <div class="form-group"><label>Message</label><textarea name="message" required></textarea></div>
    <button type="submit" class="btn btn-primary btn-block">Send via WhatsApp</button>
  </form></div>
</div></section>
<div id="site-footer"></div>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
